name: Refresh WASI Country Macros

on:
  schedule:
    # Daily at 06:00 UTC. The underlying World Bank indicators are annual, so
    # most days produce no diff and nothing is committed — but running daily
    # means a country score is never stale by more than 24h, and a failed run
    # self-heals the next morning instead of waiting for the next week.
    - cron: '0 6 * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history needed to rebuild the score time series
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch World Bank data
        run: node scripts/fetch-world-bank.mjs

      - name: Rebuild score history
        run: node scripts/build-score-history.mjs

      - name: Commit and push if data changed
        run: |
          git config user.name "WASI Data Bot"
          git config user.email "data-bot@wasi-platform.io"
          git add data/country-macros.json data/country-history.json
          if git diff --cached --quiet; then
            echo "No changes to commit — data is up to date."
          else
            git commit -m "data: auto-refresh country macros $(date -u +%Y-%m-%d)"
            git push
            echo "Data updated and pushed."
          fi
